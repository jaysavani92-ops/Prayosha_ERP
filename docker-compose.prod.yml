# PRODUCTION — Option A: single VPS (cost-conscious).
#
# THIS IS NOT HIGHLY AVAILABLE. The VPS, its disk and this MongoDB instance
# are single points of failure. Protection comes from off-site backups and a
# tested restore procedure (docs/backup-and-restore.md). Running more MongoDB
# containers on this same host would NOT add protection against host failure.
# See docs/scaling-roadmap.md for Option B (replica set on separate machines).
#
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d
#
# Only Caddy publishes ports (80/443). MongoDB and Redis sit on an internal
# network with no published ports and no internet egress. Docker-published
# ports bypass UFW, which is why nothing else is published.

name: prayosha

x-app: &app
  image: ${API_IMAGE:?set API_IMAGE, e.g. ghcr.io/org/prayosha-api:1.4.2}
  restart: unless-stopped
  env_file: .env.production
  init: true
  read_only: true
  tmpfs: ['/tmp']
  security_opt: ['no-new-privileges:true']
  cap_drop: ['ALL']
  logging:
    driver: json-file
    options: { max-size: '20m', max-file: '5' }
  depends_on:
    mongo: { condition: service_healthy }
    redis: { condition: service_healthy }

services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [edge]
    depends_on: [api]
    logging:
      driver: json-file
      options: { max-size: '20m', max-file: '5' }

  api:
    <<: *app
    deploy:
      replicas: ${API_REPLICAS:-2}
      resources:
        limits: { memory: 512m }
    stop_grace_period: 35s
    networks: [edge, backend]

  worker:
    <<: *app
    command: ['node', 'dist/worker.js']
    environment:
      HEALTH_PORT: '3001'
    deploy:
      replicas: 1
      resources:
        limits: { memory: 384m }
    stop_grace_period: 35s
    networks: [edge, backend]

  mongo:
    image: mongo:8.2
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:?}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?}
      MONGO_APP_DB: ${MONGODB_DB_NAME:-prayosha}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?}
      MONGO_MIGRATOR_PASSWORD: ${MONGO_MIGRATOR_PASSWORD:?}
      MONGO_BACKUP_PASSWORD: ${MONGO_BACKUP_PASSWORD:?}
    # Size the WiredTiger cache explicitly: the default (50% of RAM - 1GB)
    # assumes MongoDB owns the machine, which it does not here.
    command: ['--wiredTigerCacheSizeGB', '${MONGO_WT_CACHE_GB:-1}']
    volumes:
      - /srv/prayosha/mongo:/data/db
      - ./docker/mongo/init:/docker-entrypoint-initdb.d:ro
    networks: [backend]
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'quit(db.runCommand({ ping: 1 }).ok ? 0 : 1)']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    stop_grace_period: 60s
    ulimits:
      nofile: { soft: 64000, hard: 64000 }
    logging:
      driver: json-file
      options: { max-size: '50m', max-file: '5' }

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?}
      - --maxmemory
      - ${REDIS_MAXMEMORY:-256mb}
      - --maxmemory-policy
      - noeviction
      - --appendonly
      - 'yes'
      - --appendfsync
      - everysec
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - /srv/prayosha/redis:/data
    networks: [backend]
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$${REDIS_PASSWORD}" --no-auth-warning ping | grep -q PONG']
      interval: 10s
      timeout: 3s
      retries: 10

networks:
  # API/worker need egress to AWS S3, so they also join `edge`.
  edge: {}
  # No published ports, no internet access: database traffic stays on-host.
  backend:
    internal: true

volumes:
  caddy-data:
  caddy-config:
