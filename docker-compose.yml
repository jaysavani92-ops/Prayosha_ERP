# LOCAL DEVELOPMENT ONLY. Not a production topology.
#
#   cp .env.example .env
#   docker compose up -d                 # MongoDB, Redis, local S3 (RustFS)
#   npm run dev:bucket                   # create the local bucket + CORS
#   npm run db:migrate:dev && npm run dev
#   docker compose --profile app up -d   # optional: run API + worker containers too
#
# Ports bind to 127.0.0.1 only, so nothing is reachable from your network.

name: prayosha-dev

services:
  mongo:
    image: mongo:8.2
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD in .env}
      MONGO_APP_DB: ${MONGODB_DB_NAME:-prayosha}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?set MONGO_APP_PASSWORD in .env}
      MONGO_MIGRATOR_PASSWORD: ${MONGO_MIGRATOR_PASSWORD:?set MONGO_MIGRATOR_PASSWORD in .env}
      MONGO_BACKUP_PASSWORD: ${MONGO_BACKUP_PASSWORD:?set MONGO_BACKUP_PASSWORD in .env}
    command: ['--wiredTigerCacheSizeGB', '0.5']
    ports:
      - '127.0.0.1:27017:27017'
    volumes:
      - mongo-data:/data/db
      - ./docker/mongo/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'quit(db.runCommand({ ping: 1 }).ok ? 0 : 1)']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      # BullMQ requires noeviction; AOF so queued jobs survive a restart.
      - --maxmemory-policy
      - noeviction
      - --appendonly
      - 'yes'
      - --appendfsync
      - everysec
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$${REDIS_PASSWORD}" --no-auth-warning ping | grep -q PONG']
      interval: 10s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  # S3-compatible stand-in so local development needs no AWS account
  # (RustFS, Apache-2.0; MinIO no longer publishes community images).
  # Production uses AWS S3 (see docs/deployment.md).
  s3:
    image: rustfs/rustfs:1.0.3
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${AWS_ACCESS_KEY_ID:?set AWS_ACCESS_KEY_ID in .env}
      RUSTFS_SECRET_KEY: ${AWS_SECRET_ACCESS_KEY:?set AWS_SECRET_ACCESS_KEY in .env}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ':9000'
      RUSTFS_CONSOLE_ENABLE: 'true'
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - s3-data:/data

  api:
    profiles: ['app']
    build: .
    env_file: .env
    environment:
      MONGODB_URI: mongodb://prayosha_app:${MONGO_APP_PASSWORD}@mongo:27017/${MONGODB_DB_NAME:-prayosha}?authSource=${MONGODB_DB_NAME:-prayosha}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      S3_ENDPOINT: http://s3:9000
      S3_PRESIGN_ENDPOINT: http://localhost:9000
      NODE_ENV: development
      LOG_LEVEL: info
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
    init: true

  worker:
    profiles: ['app']
    build: .
    command: ['node', 'dist/worker.js']
    env_file: .env
    environment:
      MONGODB_URI: mongodb://prayosha_app:${MONGO_APP_PASSWORD}@mongo:27017/${MONGODB_DB_NAME:-prayosha}?authSource=${MONGODB_DB_NAME:-prayosha}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      S3_ENDPOINT: http://s3:9000
      NODE_ENV: development
      HEALTH_PORT: '3001'
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
    init: true

volumes:
  mongo-data:
  redis-data:
  s3-data:
