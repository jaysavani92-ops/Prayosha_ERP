name: flutter-ci

on:
  push:
    branches: [frontend]
  pull_request:
    branches: [frontend]

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.0
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - name: Every message translated
        run: test "$(cat build/untranslated_messages.json)" = "{}"
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release

  android:
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.0
          channel: stable
          cache: true
      - run: flutter build apk --debug

  ios:
    runs-on: macos-latest
    needs: verify
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.0
          channel: stable
          cache: true
      # Device build: the universal simulator build hits an Xcode 27 lipo incompatibility on Flutter 3.41.
      - run: flutter build ios --debug --no-codesign
