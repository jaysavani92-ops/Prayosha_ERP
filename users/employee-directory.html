<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Directory | Prayosha ERP</title>
    <link rel="icon" href="data:,">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Poppins', 'sans-serif'] },
                    colors: { 
                        brand: { 
                            navy: '#1E3A5F', 
                            amber: '#FFBF00' 
                        } 
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 10px 30px 0 rgba(30, 58, 95, 0.06);
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen font-sans bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] pt-20 md:pt-24 pb-28 px-4 sm:px-6 lg:px-8">
    
    <!-- Page Context Header -->
    <section class="max-w-6xl mx-auto mb-6 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
        <div>
            <div class="flex items-center gap-2 mb-1">
                <span class="text-xs uppercase tracking-wider font-semibold text-amber-600">Administration Control</span>
                <span class="text-gray-300">•</span>
                <span class="text-xs font-semibold text-gray-500">Access & Permissions</span>
            </div>
            <h1 class="text-2xl sm:text-3xl font-bold text-brand-navy tracking-tight flex items-center gap-2">
                <svg class="w-7 h-7 text-brand-amber" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path>
                </svg>
                Employee Directory & Roles
            </h1>
            <p class="text-gray-500 text-xs sm:text-sm font-medium">Manage user credentials, authorization levels, and site assignments</p>
        </div>
    </section>

    <!-- Main Workspace -->
    <main class="max-w-6xl mx-auto">
        <div class="glass-card rounded-2xl p-6 sm:p-8 border border-gray-200">
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                
                <!-- Assign New Role Form -->
                <div class="lg:col-span-1 bg-gray-50/90 p-6 rounded-xl border border-gray-200 h-fit">
                    <h2 class="text-lg font-semibold text-brand-navy mb-4">Assign New Staff Role</h2>
                    <form id="addStaffForm" class="space-y-4">
                        <div>
                            <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1">Username (Login ID)</label>
                            <input type="text" id="staff_username" placeholder="e.g. rahul" class="w-full p-2.5 rounded-lg border border-gray-300 bg-white outline-none focus:ring-2 focus:ring-brand-navy text-sm transition" required>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1">Display Name</label>
                            <input type="text" id="staff_name" placeholder="First Name Only" class="w-full p-2.5 rounded-lg border border-gray-300 bg-white outline-none focus:ring-2 focus:ring-brand-navy text-sm transition" required>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1">Authorization Role</label>
                            <select id="staff_role" class="w-full p-2.5 rounded-lg border border-gray-300 bg-white outline-none focus:ring-2 focus:ring-brand-navy text-sm transition" required>
                                <option value="">-- Select Role --</option>
                                <option value="Project Manager">Project Manager</option>
                                <option value="Construction Head">Construction Head / GM</option>
                                <option value="Site Engineer">Site Engineer</option>
                                <option value="Site Supervisor">Site Supervisor</option>
                                <option value="QA/QC Engineer">QA/QC Engineer</option>
                                <option value="Safety Officer">Safety Officer (HSE)</option>
                                <option value="Store Keeper">Store Keeper</option>
                                <option value="Accountant">Accountant</option>
                                <option value="Procurement Manager">Purchase/Procurement</option>
                                <option value="External Agency">External Agency</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1">Assigned Project</label>
                            <select id="staff_project" class="w-full p-2.5 rounded-lg border border-gray-300 bg-white outline-none focus:ring-2 focus:ring-brand-navy text-sm transition" required>
                                <option value="Prayosha Imperia">Prayosha Imperia</option>
                                <option value="All Projects">All Projects (Global)</option>
                            </select>
                        </div>
                        <button type="submit" class="w-full bg-brand-navy hover:bg-[#152a45] text-white font-bold py-3 rounded-lg shadow transition mt-2 text-sm flex items-center justify-center gap-2">
                            Add to Directory
                        </button>
                        <div id="form-feedback" class="hidden p-3 rounded-lg text-sm text-center font-medium mt-2"></div>
                    </form>
                </div>

                <!-- Active Staff Table -->
                <div class="lg:col-span-2">
                    <div class="bg-white border border-gray-200 rounded-xl overflow-hidden shadow-sm">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-brand-navy text-white text-xs uppercase tracking-wider">
                                    <th class="p-4 font-medium">Display Name</th>
                                    <th class="p-4 font-medium">Username</th>
                                    <th class="p-4 font-medium">Role Clearance</th>
                                    <th class="p-4 font-medium">Project</th>
                                    <th class="p-4 font-medium text-center">Action</th>
                                </tr>
                            </thead>
                            <tbody id="staff-table-body" class="divide-y divide-gray-100 text-sm">
                                <tr>
                                    <td colspan="5" class="p-8 text-center text-gray-400 animate-pulse">Loading directory...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <!-- Toast Notification Container -->
    <div id="toastContainer" class="fixed bottom-24 right-6 z-50 space-y-2 pointer-events-none"></div>

    <!-- Application Script (ES Module) -->
    <script type="module" src="employee-directory.js"></script>

    <!-- Universal Navigation Shell -->
    <script type="module">
        import { initShell } from '../common/shell.js';
        initShell({ activeModule: 'HUB' });
    </script>
</body>
</html>
