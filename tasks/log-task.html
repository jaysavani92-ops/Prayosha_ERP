<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log New Task | Prayosha ERP</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Poppins', 'sans-serif'] },
                    colors: {
                        brand: { navy: '#1E3A5F', amber: '#FFBF00' }
                    }
                }
            }
        }
    </script>
    <!-- Supabase JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 min-h-screen font-sans antialiased text-gray-800 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')]">
    
    <!-- Top Navigation Bar -->
    <nav class="bg-brand-navy text-white px-6 py-4 shadow-md flex justify-between items-center">
        <div class="text-xl font-semibold flex items-center gap-2">
            <span class="text-brand-amber">⬢</span> Prayosha ERP | Task Manager
        </div>
        <div class="flex items-center gap-4">
            <button class="text-sm bg-white/10 hover:bg-white/20 px-3 py-1 rounded transition">ગુજરાતી (GU)</button>
            <!-- User Profile Display -->
            <div class="text-sm font-medium flex items-center gap-2">
                <div class="w-8 h-8 rounded-full bg-brand-amber text-brand-navy flex items-center justify-center font-bold">J</div>
                Jay
            </div>
        </div>
    </nav>

    <!-- Main Content Area -->
    <main class="p-6 max-w-5xl mx-auto mt-6">
        
        <!-- Glassmorphism Form Card -->
        <div class="bg-white/80 backdrop-blur-md border border-white/40 shadow-2xl rounded-2xl p-8">
            <h2 class="text-2xl font-semibold mb-6 text-brand-navy border-b pb-3">Log New Task(s)</h2>
            
            <form id="logTaskForm" class="space-y-6">
                <!-- Dropdown Row 1 -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">Project</label>
                        <select id="project_name" class="w-full p-3 rounded-lg border border-gray-200 bg-white/50 focus:ring-2 focus:ring-brand-navy outline-none" required>
                            <option value="">-- Select --</option>
                            <option value="Prayosha Imperia">Prayosha Imperia</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">Tower / Block</label>
                        <select id="tower_block" class="w-full p-3 rounded-lg border border-gray-200 bg-white/50 focus:ring-2 focus:ring-brand-navy outline-none" required>
                            <option value="">-- Select --</option>
                            <option value="Tower A">Tower A</option>
                            <option value="Tower B">Tower B</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">Floor</label>
                        <select id="floor_level" class="w-full p-3 rounded-lg border border-gray-200 bg-white/50 focus:ring-2 focus:ring-brand-navy outline-none" required>
                            <option value="">-- Select --</option>
                            <option value="Basement">Basement</option>
                            <option value="Ground Floor">Ground Floor</option>
                            <option value="First Floor">First Floor</option>
                        </select>
                    </div>
                </div>

                <!-- Input Row 2 -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 bg-blue-50/50 p-4 rounded-xl border border-blue-100">
                    <div>
                        <label class="block text-xs font-semibold text-brand-navy uppercase tracking-wider mb-2">Category</label>
                        <select id="category" class="w-full p-3 rounded-lg border border-blue-200 bg-white focus:ring-2 focus:ring-brand-amber outline-none" required>
                            <option value="">-- Select Category --</option>
                            <option value="Brick Work">Brick Work</option>
                            <option value="RCC">RCC</option>
                            <option value="Plumbing">Plumbing</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-brand-navy uppercase tracking-wider mb-2">Zone ID</label>
                        <input type="text" id="zone_id" placeholder="e.g. GF-CLS-001" class="w-full p-3 rounded-lg border border-blue-200 bg-white focus:ring-2 focus:ring-brand-amber outline-none" required>
                    </div>
                </div>

                <!-- Detail Row 3 -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">Assigned Agency</label>
                        <select id="assigned_agency" class="w-full p-3 rounded-lg border border-gray-200 bg-white/50 focus:ring-2 focus:ring-brand-navy outline-none" required>
                            <option value="">-- Select Agency --</option>
                            <option value="Mahavir Enterprise">Mahavir Enterprise</option>
                            <option value="Somnath Realtor">Somnath Realtor</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">Expected Completion Date</label>
                        <input type="date" id="expected_completion_date" class="w-full p-3 rounded-lg border border-gray-200 bg-white/50 focus:ring-2 focus:ring-brand-navy outline-none" required>
                    </div>
                </div>

                <!-- Submit Button -->
                <div class="flex justify-end pt-4">
                    <button type="submit" class="bg-brand-navy hover:bg-[#152a45] text-white font-medium py-3 px-8 rounded-lg shadow-lg transition duration-200 flex items-center gap-2">
                        <span>Assign Task to Zone</span>
                    </button>
                </div>
                
                <!-- Feedback Message -->
                <div id="form-feedback" class="hidden p-4 rounded-lg text-sm font-medium mt-4"></div>
            </form>
        </div>
    </main>

    <!-- Load Global Config, then local logic -->
    <script src="../config.js"></script>
    <script src="log-task.js"></script>
</body>
</html>
