<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pending Tasks | Prayosha ERP</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Poppins', 'sans-serif'] },
                    colors: { brand: { navy: '#1E3A5F', amber: '#FFBF00' } }
                }
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 min-h-screen font-sans bg-[url('https://www.transparenttextures.com/patterns/cubes.png')]">
    
    <!-- Navigation -->
    <nav class="bg-brand-navy text-white px-6 py-4 shadow-md flex justify-between items-center">
        <div class="text-xl font-semibold flex items-center gap-2">
            <span class="text-brand-amber">⬢</span> Prayosha ERP | Task Manager
        </div>
        <div class="flex items-center gap-4">
            <div class="w-8 h-8 rounded-full bg-brand-amber text-brand-navy flex items-center justify-center font-bold">J</div>
        </div>
    </nav>

    <!-- Sub-Navigation (Tabs) -->
    <div class="max-w-6xl mx-auto mt-6 px-6">
        <div class="flex space-x-1 border-b border-gray-300 overflow-x-auto">
            <a href="log-task.html" class="px-6 py-3 text-sm font-medium text-gray-500 hover:text-brand-navy whitespace-nowrap">Log New Task(s)</a>
            <a href="active-tasks.html" class="px-6 py-3 text-sm font-medium text-gray-500 hover:text-brand-navy whitespace-nowrap">Active Tasks</a>
            <a href="delayed-tasks.html" class="px-6 py-3 text-sm font-medium text-gray-500 hover:text-brand-navy whitespace-nowrap">Delayed Tasks</a>
            <a href="pending-tasks.html" class="px-6 py-3 text-sm font-semibold text-white bg-brand-navy rounded-t-lg shadow-sm whitespace-nowrap">Pending Tasks</a>
            <span class="px-6 py-3 text-sm font-medium text-gray-400 cursor-not-allowed whitespace-nowrap">Tasks History</span>
        </div>
    </div>

    <!-- Main Content Area -->
    <main class="p-6 max-w-6xl mx-auto">
        <div class="bg-white/90 backdrop-blur-md shadow-xl rounded-b-2xl rounded-tr-2xl p-8 min-h-[500px]">
            
            <div class="flex justify-between items-center mb-6 pb-4 border-b">
                <h2 class="text-xl font-semibold text-gray-700 flex items-center gap-2">
                    <svg class="w-6 h-6 text-brand-amber" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    Pending / Unassigned Tasks
                </h2>
                <button onclick="loadPendingTasks()" class="text-sm text-brand-navy hover:underline">Refresh List</button>
            </div>

            <!-- Task Container (Injected by JS) -->
            <div id="pending-tasks-container" class="space-y-6">
                <div class="flex justify-center py-10">
                    <span class="text-gray-400 text-sm animate-pulse">Loading pending tasks...</span>
                </div>
            </div>

        </div>
    </main>

    <script src="../config.js"></script>
    <script src="pending-tasks.js"></script>
</body>
</html>
