<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pending Tasks | Prayosha ERP</title>
    <!-- Google Fonts: Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Poppins', 'sans-serif'] },
                    colors: {
                        brand: {
                            navy: '#1E3A5F',
                            navyDark: '#152A45',
                            amber: '#FFBF00',
                            emerald: '#10B981',
                            indigo: '#4F46E5',
                            canvas: '#F8FAFC'
                        }
                    }
                }
            }
        }
    </script>
    <!-- Supabase JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-[#F8FAFC] min-h-screen font-sans antialiased text-slate-800 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')]">

    <!-- Main Content Area -->
    <main class="max-w-6xl mx-auto px-4 py-6">
        
        <!-- Header Banner & Action Shortcuts -->
        <div class="mb-6 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
            <div>
                <div class="flex items-center gap-2 mb-1">
                    <span class="text-brand-amber font-bold text-lg">⏳</span>
                    <h1 class="text-2xl font-bold text-brand-navy tracking-tight">Pending Tasks & Zone Tree</h1>
                </div>
                <p class="text-xs text-slate-500 font-medium">Floor-wise hierarchical zone registry and pending civil packages</p>
            </div>
            
            <div class="flex items-center gap-2.5 self-start sm:self-auto">
                <a href="log-task.html" class="inline-flex items-center gap-1.5 bg-brand-navy hover:bg-brand-navyDark text-white text-xs font-semibold px-4 py-2.5 rounded-xl shadow-md shadow-brand-navy/20 transition">
                    <span class="text-brand-amber text-sm font-bold">+</span>
                    <span>Log New Task</span>
                </a>
            </div>
        </div>

        <!-- Task Suite Sub-Navigation Tabs -->
        <div class="flex items-center gap-2 overflow-x-auto pb-2 mb-6 scrollbar-none border-b border-slate-200">
            <a href="active-tasks.html" class="px-4 py-2.5 text-xs font-semibold text-slate-500 hover:text-brand-navy hover:bg-white/60 rounded-t-xl transition whitespace-nowrap">
                Active Tasks
            </a>
            <a href="pending-tasks.html" class="px-4 py-2.5 text-xs font-bold text-brand-navy border-b-2 border-brand-navy bg-white rounded-t-xl shadow-sm whitespace-nowrap">
                Pending Tasks
            </a>
            <a href="delayed-tasks.html" class="px-4 py-2.5 text-xs font-semibold text-slate-500 hover:text-brand-navy hover:bg-white/60 rounded-t-xl transition whitespace-nowrap">
                Delayed Tasks
            </a>
            <a href="issue-logs.html" class="px-4 py-2.5 text-xs font-semibold text-slate-500 hover:text-brand-navy hover:bg-white/60 rounded-t-xl transition whitespace-nowrap">
                Issue Logs
            </a>
            <a href="zone-timeline.html" class="px-4 py-2.5 text-xs font-semibold text-slate-500 hover:text-brand-navy hover:bg-white/60 rounded-t-xl transition whitespace-nowrap">
                Zone Timeline
            </a>
            <a href="tasks-history.html" class="px-4 py-2.5 text-xs font-semibold text-slate-500 hover:text-brand-navy hover:bg-white/60 rounded-t-xl transition whitespace-nowrap">
                Tasks History
            </a>
            <a href="generate-report.html" class="px-4 py-2.5 text-xs font-semibold text-slate-500 hover:text-brand-navy hover:bg-white/60 rounded-t-xl transition whitespace-nowrap">
                Generate Report
            </a>
        </div>

        <!-- Main Workspace Card -->
        <div class="bg-white/90 backdrop-blur-md border border-slate-200/80 shadow-xl rounded-2xl p-6 sm:p-8 min-h-[500px]">
            
            <!-- Toolbar: Project Filter Badge, Search & Quick Actions -->
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6 pb-5 border-b border-slate-100">
                <div class="flex flex-wrap items-center gap-2.5">
                    <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">Filtered Project:</span>
                    <span id="activeProjectBadge" class="text-xs font-semibold bg-brand-navy/10 text-brand-navy px-3 py-1 rounded-lg border border-brand-navy/20">
                        Synchronizing...
                    </span>
                    <!-- Tower Filter -->
                    <select id="towerFilter" class="text-xs font-semibold px-2.5 py-1.5 rounded-xl border border-slate-200 bg-slate-50/70 focus:bg-white focus:ring-2 focus:ring-brand-navy outline-none cursor-pointer transition">
                        <option value="">All Towers / Blocks</option>
                    </select>
                </div>

                <div class="flex flex-wrap items-center gap-2.5">
                    <!-- Zone ID / Room Search -->
                    <div class="relative min-w-[210px]">
                        <input type="text" id="zoneSearchInput" placeholder="Search Zone ID or Room..." class="w-full text-xs font-medium pl-8 pr-3 py-2 rounded-xl border border-slate-200 bg-slate-50/50 focus:bg-white focus:ring-2 focus:ring-brand-navy focus:border-transparent outline-none transition">
                        <svg class="w-3.5 h-3.5 text-slate-400 absolute left-2.5 top-1/2 -translate-y-1/2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    </div>

                    <!-- Accordion Expand/Collapse All -->
                    <div class="inline-flex rounded-xl border border-slate-200 bg-slate-50/60 p-0.5 text-xs font-semibold">
                        <button type="button" id="btnExpandAll" class="px-2.5 py-1.5 rounded-lg text-slate-600 hover:text-brand-navy hover:bg-white transition">
                            Expand All
                        </button>
                        <button type="button" id="btnCollapseAll" class="px-2.5 py-1.5 rounded-lg text-slate-600 hover:text-brand-navy hover:bg-white transition">
                            Collapse All
                        </button>
                    </div>

                    <!-- Refresh Button -->
                    <button id="refreshPendingBtn" title="Refresh Zone Tree" class="p-2 rounded-xl border border-slate-200 bg-slate-50/60 hover:bg-slate-100 text-slate-600 transition">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                    </button>
                </div>
            </div>

            <!-- Floor-Wise Hierarchical Zone Container -->
            <div id="pending-tasks-container" class="space-y-4">
                <div class="flex flex-col items-center justify-center py-20 text-slate-400">
                    <svg class="animate-spin h-7 w-7 text-brand-amber mb-3" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
                    </svg>
                    <span class="text-xs font-semibold">Building hierarchical zone tree...</span>
                </div>
            </div>

        </div>
    </main>

    <!-- Global Config & Logic Scripts -->
    <script src="../config.js"></script>
    <script type="module" src="pending-tasks.js"></script>
    
    <!-- Universal Navigation Shell -->
    <script type="module">
        import { initShell } from '../common/shell.js';
        document.addEventListener('DOMContentLoaded', () => initShell({ activeModule: 'tasks' }));
    </script>
</body>
</html>
