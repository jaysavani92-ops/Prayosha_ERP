<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Issue / Blocker | Prayosha ERP</title>
    <!-- Google Fonts: Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Poppins', 'sans-serif'] },
                    colors: {
                        brand: {
                            navy: '#1E3A5F',
                            navyDark: '#152A45',
                            amber: '#FFBF00',
                            emerald: '#10B981',
                            indigo: '#4F46E5',
                            canvas: '#F8FAFC'
                        }
                    }
                }
            }
        }
    </script>
    <!-- Supabase JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-[#F8FAFC] min-h-screen font-sans antialiased text-slate-800 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')]">

    <!-- Main Content Area -->
    <main class="max-w-4xl mx-auto px-4 py-6">
        
        <!-- Header Banner & Action Shortcuts -->
        <div class="mb-6 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
            <div>
                <div class="flex items-center gap-2 mb-1">
                    <span class="text-red-600 font-bold text-lg">🚨</span>
                    <h1 class="text-2xl font-bold text-brand-navy tracking-tight">Report Critical Issue</h1>
                </div>
                <p class="text-xs text-slate-500 font-medium">Log site blockers, material delays, trade clashes, or design discrepancies</p>
            </div>
            
            <a href="issue-logs.html" class="inline-flex items-center gap-1.5 text-xs font-semibold text-brand-navy hover:text-brand-navyDark bg-white border border-slate-200 px-3.5 py-2 rounded-xl shadow-sm hover:shadow transition self-start sm:self-auto">
                <svg class="w-4 h-4 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                <span>View Issue Logs</span>
            </a>
        </div>

        <!-- Task Suite Sub-Navigation Tabs -->
        <div class="flex items-center gap-2 overflow-x-auto pb-2 mb-6 scrollbar-none border-b border-slate-200">
            <a href="active-tasks.html" class="px-4 py-2.5 text-xs font-semibold text-slate-500 hover:text-brand-navy hover:bg-white/60 rounded-t-xl transition whitespace-nowrap">
                Active Tasks
            </a>
            <a href="pending-tasks.html" class="px-4 py-2.5 text-xs font-semibold text-slate-500 hover:text-brand-navy hover:bg-white/60 rounded-t-xl transition whitespace-nowrap">
                Pending Tasks
            </a>
            <a href="delayed-tasks.html" class="px-4 py-2.5 text-xs font-semibold text-slate-500 hover:text-brand-navy hover:bg-white/60 rounded-t-xl transition whitespace-nowrap">
                Delayed Tasks
            </a>
            <a href="issue-logs.html" class="px-4 py-2.5 text-xs font-bold text-brand-navy border-b-2 border-brand-navy bg-white rounded-t-xl shadow-sm whitespace-nowrap">
                Issue Logs
            </a>
            <a href="zone-timeline.html" class="px-4 py-2.5 text-xs font-semibold text-slate-500 hover:text-brand-navy hover:bg-white/60 rounded-t-xl transition whitespace-nowrap">
                Zone Timeline
            </a>
            <a href="tasks-history.html" class="px-4 py-2.5 text-xs font-semibold text-slate-500 hover:text-brand-navy hover:bg-white/60 rounded-t-xl transition whitespace-nowrap">
                Tasks History
            </a>
            <a href="generate-report.html" class="px-4 py-2.5 text-xs font-semibold text-slate-500 hover:text-brand-navy hover:bg-white/60 rounded-t-xl transition whitespace-nowrap">
                Generate Report
            </a>
        </div>

        <!-- Glassmorphism Form Card -->
        <div class="bg-white/90 backdrop-blur-md border border-slate-200/80 border-t-4 border-t-red-600 shadow-xl rounded-2xl p-6 sm:p-8">
            <form id="raiseIssueForm" class="space-y-6">
                
                <!-- Location & Structural Identification -->
                <div class="grid grid-cols-1 md:grid-cols-4 gap-4 bg-red-50/50 p-4 sm:p-5 rounded-2xl border border-red-100">
                    <div>
                        <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-2">Project</label>
                        <select id="project_name" class="w-full p-2.5 text-sm font-semibold rounded-xl border border-slate-200 bg-white focus:ring-2 focus:ring-red-500 focus:border-transparent outline-none transition" required>
                            <option value="">-- Loading Projects --</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-2">Tower / Block</label>
                        <select id="tower_block" class="w-full p-2.5 text-sm rounded-xl border border-slate-200 bg-white focus:ring-2 focus:ring-red-500 focus:border-transparent outline-none transition" required>
                            <option value="">-- Select Tower --</option>
                            <option value="Tower A">Tower A</option>
                            <option value="Tower B">Tower B</option>
                            <option value="Tower C">Tower C</option>
                            <option value="Club House">Club House</option>
                            <option value="Infrastructure / External">Infrastructure / External</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-2">Floor Level</label>
                        <select id="floor_level" class="w-full p-2.5 text-sm rounded-xl border border-slate-200 bg-white focus:ring-2 focus:ring-red-500 focus:border-transparent outline-none transition" required>
                            <option value="">-- Select Floor --</option>
                            <option value="Basement 2">Basement 2</option>
                            <option value="Basement 1">Basement 1</option>
                            <option value="Ground Floor">Ground Floor</option>
                            <option value="Podium">Podium</option>
                            <option value="1st Floor">1st Floor</option>
                            <option value="2nd Floor">2nd Floor</option>
                            <option value="3rd Floor">3rd Floor</option>
                            <option value="4th Floor">4th Floor</option>
                            <option value="5th Floor">5th Floor</option>
                            <option value="Terrace">Terrace</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-red-700 uppercase tracking-wider mb-2">Zone ID</label>
                        <input type="text" id="zone_id" placeholder="e.g. GF-CLS-001" class="w-full p-2.5 text-sm font-bold rounded-xl border border-red-200 bg-white focus:ring-2 focus:ring-red-500 focus:border-transparent outline-none uppercase transition" required>
                    </div>
                </div>

                <!-- Description Area -->
                <div>
                    <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-2">Issue / Blocker Description</label>
                    <textarea id="description" rows="4" placeholder="Detail the physical obstruction or delay factor (e.g. Ready-Mix batching delayed, electrical conduit clash with HVAC duct, water table seepage in basement)..." class="w-full p-3.5 text-sm rounded-xl border border-slate-200 bg-slate-50/50 focus:bg-white focus:ring-2 focus:ring-red-500 focus:border-transparent outline-none resize-none transition leading-relaxed" required></textarea>
                </div>

                <!-- Reporter & Submission Row -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-5 items-end pt-2 border-t border-slate-100">
                    <div>
                        <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-2">Reported By</label>
                        <input type="text" id="reported_by" value="Site Engineer" class="w-full p-3 text-sm rounded-xl border border-slate-200 bg-slate-100 text-slate-600 font-semibold cursor-not-allowed outline-none" readonly>
                    </div>
                    <div class="flex items-center justify-end gap-3">
                        <button type="reset" class="px-4 py-2.5 text-xs font-semibold text-slate-500 hover:text-slate-800 transition">
                            Clear
                        </button>
                        <button type="submit" class="w-full md:w-auto bg-red-600 hover:bg-red-700 text-white font-semibold py-3 px-8 rounded-xl shadow-lg shadow-red-600/20 transition duration-200 flex items-center justify-center gap-2 cursor-pointer">
                            <span>🚨</span>
                            <span>Submit Critical Issue</span>
                        </button>
                    </div>
                </div>
                
                <!-- Feedback Status Box -->
                <div id="issue-feedback" class="hidden p-4 rounded-xl text-sm font-medium mt-4 transition-all"></div>
            </form>
        </div>
    </main>

    <!-- Global Config & Local Logic -->
    <script src="../config.js"></script>
    <script src="raise-issue.js"></script>
    
    <!-- Universal Navigation Shell -->
    <script type="module">
        import { initShell } from '../common/shell.js';
        initShell({ activeModule: 'tasks' });
    </script>
</body>
</html>
