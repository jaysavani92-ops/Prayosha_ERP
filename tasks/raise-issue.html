<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raise Issue | Prayosha ERP</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Poppins', 'sans-serif'] },
                    colors: { brand: { navy: '#1E3A5F', amber: '#FFBF00' } }
                }
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 min-h-screen font-sans bg-[url('https://www.transparenttextures.com/patterns/cubes.png')]">
    
    <!-- Navigation -->
    <nav class="bg-brand-navy text-white px-6 py-4 shadow-md flex justify-between items-center">
        <div class="text-xl font-semibold flex items-center gap-2">
            <span class="text-brand-amber">⬢</span> Prayosha ERP | Task Manager
        </div>
        <div class="flex items-center gap-4">
            <button class="text-sm bg-white/10 hover:bg-white/20 px-3 py-1 rounded transition">ગુજરાતી (GU)</button>
            <div class="w-8 h-8 rounded-full bg-brand-amber text-brand-navy flex items-center justify-center font-bold">J</div>
        </div>
    </nav>

    <!-- Sub-Navigation (Tabs) -->
    <div class="max-w-6xl mx-auto mt-6 px-6">
        <div class="flex space-x-1 border-b border-gray-300 overflow-x-auto">
            <a href="zone-timeline.html" class="px-6 py-3 text-sm font-medium text-gray-500 hover:text-brand-navy whitespace-nowrap">Zone Timeline</a>
            <span class="px-6 py-3 text-sm font-medium text-gray-400 cursor-not-allowed whitespace-nowrap">Issue Logs</span>
            <a href="raise-issue.html" class="px-6 py-3 text-sm font-semibold text-white bg-red-600 rounded-t-lg shadow-sm whitespace-nowrap">Raise Issue</a>
            <span class="px-6 py-3 text-sm font-medium text-gray-400 cursor-not-allowed whitespace-nowrap">Generate Report</span>
        </div>
    </div>

    <!-- Main Content Area -->
    <main class="p-6 max-w-4xl mx-auto">
        
        <div class="bg-white/80 backdrop-blur-md border-t-4 border-red-600 shadow-2xl rounded-b-2xl p-8">
            <h2 class="text-2xl font-semibold mb-6 text-red-700 flex items-center gap-2 border-b border-gray-200 pb-3">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                Report Issue / Blocker
            </h2>
            
            <form id="raiseIssueForm" class="space-y-6">
                
                <!-- Location Row -->
                <div class="grid grid-cols-1 md:grid-cols-4 gap-4 bg-red-50/50 p-4 rounded-xl border border-red-100">
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-2">Project</label>
                        <select id="project_name" class="w-full p-2.5 rounded border border-gray-200 bg-white focus:ring-1 focus:ring-red-500 outline-none" required>
                            <option value="Prayosha Imperia">Prayosha Imperia</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-2">Tower</label>
                        <select id="tower_block" class="w-full p-2.5 rounded border border-gray-200 bg-white focus:ring-1 focus:ring-red-500 outline-none" required>
                            <option value="Tower A">Tower A</option>
                            <option value="Tower B">Tower B</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-2">Floor</label>
                        <select id="floor_level" class="w-full p-2.5 rounded border border-gray-200 bg-white focus:ring-1 focus:ring-red-500 outline-none" required>
                            <option value="Basement">Basement</option>
                            <option value="Ground Floor">Ground Floor</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-red-700 uppercase tracking-wider mb-2">Zone ID</label>
                        <input type="text" id="zone_id" placeholder="e.g. PRY-A-B-FL-101" class="w-full p-2.5 rounded border border-red-200 bg-white focus:ring-1 focus:ring-red-500 outline-none font-bold" required>
                    </div>
                </div>

                <!-- Description Area -->
                <div>
                    <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-2">Issue Description</label>
                    <textarea id="description" rows="4" placeholder="Describe the blocker in detail (e.g., Material shortage, Water leakage)..." class="w-full p-3 rounded-lg border border-gray-200 bg-white/50 focus:ring-2 focus:ring-red-400 outline-none resize-none" required></textarea>
                </div>

                <!-- Footer Row -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 items-end">
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-2">Reported By (Auto)</label>
                        <input type="text" id="reported_by" value="Jay Savani" class="w-full p-3 rounded-lg border border-gray-200 bg-gray-100 text-gray-500 font-medium cursor-not-allowed" readonly>
                    </div>
                    <div class="flex justify-end">
                        <button type="submit" class="w-full md:w-auto bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-8 rounded-lg shadow-lg transition duration-200 flex items-center justify-center gap-2">
                            <span>Submit Critical Issue</span>
                        </button>
                    </div>
                </div>
                
                <!-- Feedback Message -->
                <div id="issue-feedback" class="hidden p-4 rounded-lg text-sm font-medium mt-4"></div>
            </form>
        </div>
    </main>

    <script src="../config.js"></script>
    <script src="raise-issue.js"></script>
</body>
</html>
