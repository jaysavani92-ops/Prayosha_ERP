<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Active Tasks | Prayosha ERP</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Poppins', 'sans-serif'] },
                    colors: { brand: { navy: '#1E3A5F', amber: '#FFBF00' } }
                }
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 min-h-screen font-sans bg-[url('https://www.transparenttextures.com/patterns/cubes.png')]">
    
    <!-- Navigation -->
    <nav class="bg-brand-navy text-white px-6 py-4 shadow-md flex justify-between items-center">
        <div class="text-xl font-semibold flex items-center gap-2">
            <span class="text-brand-amber">⬢</span> Prayosha ERP | Task Manager
        </div>
        <div class="flex items-center gap-4">
            <a href="log-task.html" class="text-sm bg-white/10 hover:bg-white/20 px-3 py-1 rounded transition">Log New Task</a>
            <div class="w-8 h-8 rounded-full bg-brand-amber text-brand-navy flex items-center justify-center font-bold">J</div>
        </div>
    </nav>

    <!-- Sub-Navigation (Tabs) -->
    <div class="max-w-6xl mx-auto mt-6 px-6">
        <div class="flex space-x-1 border-b border-gray-300">
            <a href="log-task.html" class="px-6 py-3 text-sm font-medium text-gray-500 hover:text-brand-navy">Log New Task(s)</a>
            <a href="active-tasks.html" class="px-6 py-3 text-sm font-semibold text-white bg-brand-navy rounded-t-lg shadow-sm">Active Tasks</a>
            <span class="px-6 py-3 text-sm font-medium text-gray-400 cursor-not-allowed">Delayed Tasks</span>
            <span class="px-6 py-3 text-sm font-medium text-gray-400 cursor-not-allowed">Pending Tasks</span>
        </div>
    </div>

    <!-- Main Content Area -->
    <main class="p-6 max-w-6xl mx-auto">
        <div class="bg-white/90 backdrop-blur-md shadow-xl rounded-b-2xl rounded-tr-2xl p-8 min-h-[500px]">
            
            <!-- Filters -->
            <div class="flex justify-between items-center mb-6 pb-4 border-b">
                <h2 class="text-xl font-semibold text-brand-navy">Currently Active Tasks</h2>
                <select id="projectFilter" class="p-2 border rounded-md text-sm outline-none focus:ring-1 focus:ring-brand-navy">
                    <option value="Prayosha Imperia">Prayosha Imperia</option>
                </select>
            </div>

            <!-- Task Container (Injected by JS) -->
            <div id="active-tasks-container" class="space-y-4">
                <div class="flex justify-center py-10">
                    <span class="text-gray-400 text-sm animate-pulse">Loading active tasks from database...</span>
                </div>
            </div>

        </div>
    </main>

    <script src="../config.js"></script>
    <script src="active-tasks.js"></script>
</body>
</html>
